name: Release

# Runs when `develop` is merged into `master`. Computes the next semver from
# Conventional Commits since the last version tag using semantic-release,
# tags `master`, then builds and publishes packages for macOS, Linux, and
# Windows with release notes generated from the commit history.
#
# Versioning/notes config lives in `.releaserc.yaml`. See
# openspec/changes/add-release-packaging-workflow for design rationale.

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute version, tag, and release notes
    runs-on: ubuntu-latest

    outputs:
      new_tag: ${{ steps.semantic.outputs.new_release_version }}
      new_version: ${{ steps.semantic.outputs.new_release_version }}
      release_notes: ${{ steps.semantic.outputs.new_release_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute next version, tag, and release notes
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          # No "v" prefix, matching the existing tag scheme (e.g. `0.0.6`);
          # see `tagFormat` in `.releaserc.yaml`. Commits that don't follow
          # Conventional Commits don't fail this step: the
          # conventionalcommits preset just ignores them when computing the
          # next version (see the comment in `.releaserc.yaml`).
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package and publish
    needs: version
    if: needs.version.outputs.new_tag
    uses: ./.github/workflows/package.yaml
    with:
      tag: ${{ needs.version.outputs.new_tag }}
      prerelease: false
      ref: master
      release_notes: ${{ needs.version.outputs.release_notes }}
    secrets: inherit

  update-site-links:
    name: Update download links on pilgrimagesoftware/site
    needs: [version, package]
    if: needs.version.outputs.new_tag
    runs-on: ubuntu-latest

    steps:
      # SITE_REPO_TOKEN must be a PAT (classic "repo" scope, or fine-grained
      # with contents:read/write on pilgrimagesoftware/site) - the default
      # GITHUB_TOKEN is scoped to this repo only and can't push elsewhere.
      - name: Checkout pilgrimagesoftware/site
        uses: actions/checkout@v7
        with:
          repository: pilgrimagesoftware/site
          token: ${{ secrets.SITE_REPO_TOKEN }}

      - name: Update Libri download links
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          FILE=public/apps/libri/index.html
          # Asset filenames follow Libri_<tag>_<arch>.<ext> (see package.yaml);
          # this repoints the macOS/Linux download links at the new tag
          # regardless of what version they previously pointed to.
          sed -i -E "s#/releases/download/[^/]+/Libri_[^_]+_#/releases/download/${TAG}/Libri_${TAG}_#g" "$FILE"

      - name: Commit and push
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apps/libri/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Libri download links to ${TAG}"
            git push
          fi
