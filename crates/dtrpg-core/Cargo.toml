[package]
name = "dtrpg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
dtrpg-sdk.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }
serde = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
keyring = { workspace = true }
md5 = { workspace = true }
base64 = { workspace = true }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
reqwest = { workspace = true }
rusqlite = { version = "0.40.0", default-features = false, features = ["bundled"] }

[features]
# Enables Sentry crash/error reporting. Compiled in only for CI-built release
# artifacts; source builds (`cargo build`/`cargo test`/`cargo run` with no
# explicit feature flags) never pull in the Sentry dependency.
sentry = ["dep:sentry", "dep:sentry-tracing"]

[target.'cfg(target_os = "macos")'.dependencies]
# Used by `platform::macos` for iCloud offloaded-file detection
# (`NSURLUbiquitousItemDownloadingStatusKey`) via `NSURL`'s resource values.
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Used by `platform::windows` for cloud-placeholder file-attribute detection
# (`FILE_ATTRIBUTE_RECALL_ON_DATA_ACCESS`) via `GetFileAttributesW`.
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
